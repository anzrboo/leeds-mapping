services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${LCM_DB}
      POSTGRES_USER: ${LCM_USER}
      POSTGRES_PASSWORD: ${LCM_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: